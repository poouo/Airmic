# AirMic docker compose
#
# 1) 准备配置（可选，全部使用默认值也能跑）：
#      cp .env.example .env      # Windows: Copy-Item .env.example .env
#        - 反向代理后把 TRUST_PROXY 改为 true
#        - 直接对外暴露时建议设置 JWT_SECRET
# 2) 构建并启动：
#      docker compose up -d --build
# 3) 查看状态与日志：
#      docker compose ps
#      docker compose logs -f airmic
# 4) 备份（备份文件会写入 /data/backups，随命名卷持久化）：
#      docker compose exec airmic node scripts/backup.mjs
#
# 可选：TURN 中继服务（coturn）
#      - 先把 deploy/coturn.conf 里的 realm / external-ip / 用户名密码改好
#      - 再执行：docker compose --profile turn up -d
#      - 需要 Linux 主机（network_mode: host）；Windows/macOS Docker Desktop 不支持 host 网络，
#        请改为在宿主机安装 coturn，或映射端口并把 external-ip 配成宿主机公网 IP。
name: airmic

services:
  airmic:
    build:
      context: .
      dockerfile: Dockerfile
    image: airmic:latest
    container_name: airmic
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      # Compose >= 2.24 支持 required: false（.env 不存在时也能启动）。
      # 旧版 Compose 请改成下面一行： - .env
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_PATH: /data/airmic.db
      WEB_DIST: /app/web/dist
      # 容器内备份默认写入数据卷（可在 .env 中覆盖 BACKUP_DIR）
      BACKUP_DIR: /data/backups
      RETENTION: "10"
    volumes:
      - airmic-data:/data
      # 可选：容器内直接启用 HTTPS 时挂载自签证书，并在 .env 设置
      #   SSL_KEY=/app/certs/key.pem
      #   SSL_CERT=/app/certs/cert.pem
      # - ./certs:/app/certs:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 20s

  # 可选：coturn TURN 中继（默认不启动，使用 --profile turn）
  coturn:
    image: coturn/coturn:4.6.3
    container_name: airmic-coturn
    profiles: ["turn"]
    restart: unless-stopped
    # TURN 中继需要大量 UDP 端口，host 网络是 Linux 上最可靠的部署方式。
    # 注意：host 网络下 compose 的 ports 会被忽略，防火墙直接管理宿主机端口。
    network_mode: host
    volumes:
      - ./deploy/coturn.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
    # 桥接网络替代方案（Linux）：删除 network_mode: host，改为下面的端口映射，
    # 但必须在 coturn 配置中填写 external-ip=<宿主机公网IP>，否则中继候选不可用。
    # ports:
    #   - "3478:3478/tcp"
    #   - "3478:3478/udp"
    #   - "49160-49200:49160-49200/udp"

volumes:
  airmic-data:
    name: airmic-data
