# =============================================================================
# AirMic Nginx 反向代理配置（HTTPS + WebSocket）
#
# 使用方式（Debian/Ubuntu）：
#   1. 修改 server_name / 证书路径 / 上游端口
#   2. sudo cp deploy/nginx.conf /etc/nginx/conf.d/airmic.conf
#      （或放到 /etc/nginx/sites-available/ 后 ln -s 到 sites-enabled/）
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# 前提：
#   - AirMic 监听 127.0.0.1:3000（.env: HOST=127.0.0.1 PORT=3000 TRUST_PROXY=true）
#   - 前端静态文件由 Node/Fastify 托管（默认与推荐方式，无需额外配置 root）
#
# 说明：map 指令必须位于 http 上下文；conf.d/*.conf 与 sites-enabled/* 都是被 http{}
#       包含的，因此本文件的写法可以直接使用。
# =============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP -> HTTPS 跳转
server {
    listen 80;
    listen [::]:80;
    server_name airmic.example.com;

    # 证书续期 / 健康检查可放行
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx >= 1.25.1 推荐写成：listen 443 ssl; listen [::]:443 ssl; 并单独加 http2 on;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name airmic.example.com;

    # ---- 证书 ----
    # 公网域名（Let's Encrypt / certbot）：
    ssl_certificate     /etc/letsencrypt/live/airmic.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/airmic.example.com/privkey.pem;
    # 局域网自签证书（node scripts/generate-cert.mjs）示例：
    # ssl_certificate     /opt/airmic/certs/cert.pem;
    # ssl_certificate_key /opt/airmic/certs/key.pem;
    # ssl_trusted_certificate /opt/airmic/certs/cert.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:AirMicTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # AirMic 请求体上限为 2 MB（Fastify bodyLimit）
    client_max_body_size 2m;
    keepalive_timeout 65;

    # ---- 安全响应头（AirMic 对 /api 已设置部分，这里全局补齐）----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(self), display-capture=(self)" always;

    # ---- 压缩 ----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # ---- WebSocket 信令（/ws）：语音信令、聊天、在线状态 ----
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # WebSocket 长连接，避免 60s 默认超时断开
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---- REST API ----
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # ---- 前端页面与静态资源（方案 A：由 Node 托管，推荐）----
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # =========================================================================
    # 方案 B：让 Nginx 直接托管前端构建产物（Node 只处理 /api 与 /ws）
    #   - 适用：静态资源访问量大，希望 Nginx 直接返回、并给 assets 加长缓存
    #   - 步骤：npm run build 后把 web/dist 复制到 /var/www/airmic（或直接 root 指向）
    #   - 注意：启用方案 B 时，必须把上面 location / 的 proxy_pass 去掉/替换
    #
    # root /var/www/airmic;
    # index index.html;
    #
    # location /assets/ {
    #     try_files $uri =404;
    #     expires 30d;
    #     add_header Cache-Control "public, immutable";
    # }
    #
    # location / {
    #     try_files $uri $uri/ /index.html;
    # }
    # =========================================================================
}

# 可选：Cloudflare / 其它 CDN 后面的真实 IP
# 需要 ngx_http_realip_module；按实际 CDN 段配置
# set_real_ip_from 173.245.48.0/20;
# real_ip_header CF-Connecting-IP;
