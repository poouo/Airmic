# =============================================================================
# coturn 配置示例（AirMic 的 TURN 中继）
#
# 安装（Debian/Ubuntu）：
#   sudo apt install coturn
#   sudo cp deploy/coturn.conf /etc/turnserver.conf
#   sudo sed -i 's/^#TURNSERVER_ENABLED=1/TURNSERVER_ENABLED=1/' /etc/default/coturn
#   sudo systemctl enable --now coturn
#
# 使用前必须修改：
#   - external-ip：服务器公网 IP（云主机多网卡时必填；单网卡可留空测试）
#   - realm / server-name：你的域名或服务器名
#   - user：AirMic 管理后台 ICE 配置里使用的用户名:密码
#
# 防火墙需放行：
#   - 3478/tcp、3478/udp           STUN/TURN
#   - 49160-49200/udp              中继端口（与下方 min-port/max-port 一致）
#   - 5349/tcp                     可选：TURN over TLS
#   - 443/tcp+udp                  备选：仅放行 443 的网络可用 TURN over TLS（见 docs/DEPLOY.md）
# =============================================================================

# 监听端口
listening-port=3478

# TURN over TLS（可选）：需要域名证书，另需放行 5349/tcp
# tls-listening-port=5349
# cert=/etc/letsencrypt/live/turn.example.com/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.example.com/privkey.pem
# cipher-list="ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM"

# 对外可达的公网 IP；多 IP 用逗号分隔，例如 external-ip=203.0.113.10/10.0.0.5
external-ip=203.0.113.10

# 中继端口范围（UDP），需与防火墙放行范围一致
min-port=49160
max-port=49200

# 认证方式：静态用户名/密码（与 AirMic 管理后台里填写的 username/credential 一致）
lt-cred-mech
realm=airmic.example.com
server-name=airmic.example.com
user=airmic:CHANGE_ME_STRONG_PASSWORD

# 备选：TURN REST API 动态凭证（AirMic 当前不会自动签发临时凭证；
# 自行实现签发逻辑后可用下面的方式）
# use-auth-secret
# static-auth-secret=CHANGE_ME_LONG_RANDOM_SECRET

# 基础安全与兼容项
fingerprint
stale-nonce=600
no-multicast-peers
no-cli
# 禁止中继到 loopback，避免被当作内网扫描跳板（同机自测 TURN 时先注释掉）
no-loopback-peers
# 如果只希望降低暴露面，可以禁止 TCP 中继；但会降低 UDP 被封时的成功率
# no-tcp-relay

# 端口/资源限制
max-bps=0
total-quota=0
user-quota=0

# 日志：输出到 stdout，交给 systemd/journald 或 docker logs 收集
log-file=stdout
simple-log
