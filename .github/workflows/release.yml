name: Release

# 打版本标签（如 v1.1.0）时自动：
# 1) 构建平台无关的预构建包 airmic-<version>.tar.gz + .sha256，并创建 GitHub Release 上传资产
#    （VPS 部署/升级直接下载预构建包，不在服务器上编译）
# 2) 构建 AirMic Docker 镜像并推送到 GitHub Container Registry（ghcr.io）
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  bundle:
    name: Build release bundle and publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          echo "package=$VERSION tag=$TAG"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $VERSION; bump version before tagging"
            exit 1
          fi

      - name: Build prebuilt bundle (with smoke test)
        run: node scripts/build-release-bundle.mjs

      - name: Create Release and upload bundle assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist-release/airmic-*.tar.gz
            dist-release/airmic-*.tar.gz.sha256

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
